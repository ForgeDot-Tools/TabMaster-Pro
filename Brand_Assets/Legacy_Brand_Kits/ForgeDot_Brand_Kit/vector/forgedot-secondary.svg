<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <filter id="cyanGlow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="textGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--fd-gradient-start, #6c63ff)" />
      <stop offset="100%" stop-color="var(--fd-gradient-end, #00d4ff)" />
    </linearGradient>
    <style>
      .text-fd-stacked { font-family: 'Inter', 'Montserrat', sans-serif; font-weight: 700; font-size: 160px; fill: var(--fd-text-primary, #ffffff); }
      .text-tools-stacked { font-family: 'Inter', 'Montserrat', sans-serif; font-weight: 700; font-size: 160px; fill: url(#textGrad2); }

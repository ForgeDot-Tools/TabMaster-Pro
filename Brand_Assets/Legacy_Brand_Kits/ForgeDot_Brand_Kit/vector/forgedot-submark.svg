<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="brand-logo" width="100%" height="100%">
  <defs>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Geometric F and D -->
  <g stroke="var(--fd-text-primary, #ffffff)" stroke-width="28" stroke-linecap="square" stroke-linejoin="miter" fill="none">
    <path d="M 192,128 L 128,128 L 128,384" />
    <path d="M 128,256 L 184,256" />
    <path d="M 320,384 L 320,128 L 352,128 L 384,160 L 384,352 L 352,384 Z" />
  </g>
  <!-- Impact Point Dot -->
  <circle cx="256" cy="256" r="32" fill="var(--fd-accent, #00E5FF)" filter="url(#cyanGlow)" />
</svg>
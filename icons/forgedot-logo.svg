<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    .fd-letters { stroke: #1f2328; }
    @media (prefers-color-scheme: dark) {
      .fd-letters { stroke: #ffffff; }
    }
  </style>
  <!-- Transparent Background -->
  <rect width="512" height="512" fill="transparent" />

  <defs>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Responsive Geometric F and D -->
  <g class="fd-letters" stroke-width="28" stroke-linecap="square" stroke-linejoin="miter" fill="none">
    <!-- Letter F (Left) -->
    <path d="M 192,128 L 128,128 L 128,384" />
    <path d="M 128,256 L 184,256" />

    <!-- Letter D (Right) -->
    <path d="M 320,384 L 320,128 L 352,128 L 384,160 L 384,352 L 352,384 Z" />
  </g>

  <!-- Electric Cyan Impact Point Dot -->
  <circle cx="256" cy="256" r="32" fill="#00E5FF" filter="url(#cyanGlow)" />
</svg>
